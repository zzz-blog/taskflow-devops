---
- name: 更新软件包索引
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: 安装基础工具
  ansible.builtin.apt:
    name: [curl, git, htop, jq]
    state: present

- name: 内核参数：允许 IP 转发（K8s 必需）
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true
