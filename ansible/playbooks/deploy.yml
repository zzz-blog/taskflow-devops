# 应用部署：拉代码 + kustomize 部署到 k3s
- name: 部署 TaskFlow 到集群
  hosts: k3s_nodes
  become: true
  vars:
    app_dir: /opt/taskflow
    git_repo: "https://github.com/example/devops.git" # 替换为你的仓库地址
    git_ref: main
  tasks:
    - name: 拉取最新代码
      ansible.builtin.git:
        repo: "{{ git_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ git_ref }}"
        force: true

    - name: 应用 kustomize 生产配置
      ansible.builtin.command:
        cmd: k3s kubectl apply -k {{ app_dir }}/k8s/overlays/prod
        chdir: "{{ app_dir }}"
      register: apply_result
      changed_when: "'configured' in apply_result.stdout or 'created' in apply_result.stdout"

    - name: 等待 API 就绪
      ansible.builtin.command:
        cmd: k3s kubectl rollout status deployment/api -n taskflow --timeout=180s
      changed_when: false
