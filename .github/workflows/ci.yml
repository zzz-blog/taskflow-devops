name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 代码与配置规范检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: yamllint（YAML 规范）
        run: |
          pip install yamllint==1.35.1
          yamllint .

      - name: hadolint（Dockerfile 规范）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/api/Dockerfile

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/web/Dockerfile

      - name: kubeconform（K8s 清单 Schema 校验）
        run: >
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/yannh/kubeconform:v0.6.7
          -ignore-missing-schemas -summary
          k8s/base k8s/overlays/dev k8s/overlays/prod

      - name: Helm Chart lint
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - run: helm lint helm/taskflow

      - name: Terraform fmt / validate
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

  test:
    name: 单元测试与覆盖率门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven 测试 + JaCoCo 覆盖率门禁（行覆盖 ≥ 80%）
        # 用 sh 调用避免 Windows 提交丢失 mvnw 可执行位
        run: sh ./mvnw -B verify

  build-scan:
    name: 镜像构建与安全扫描
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 统一镜像名（GHCR 要求小写）
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 构建镜像
        run: |
          docker build -t taskflow-api:ci app/api
          docker build -t taskflow-web:ci app/web

      - name: Trivy 漏洞扫描（CRITICAL/HIGH 未修复项即失败）
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: taskflow-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: taskflow-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: 推送到 GHCR（仅 main 分支）
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ steps.repo.outputs.name }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          SHA_TAG="${GITHUB_SHA::7}"
          for svc in api web; do
            IMAGE="ghcr.io/${OWNER}/taskflow-${svc}"
            docker tag "taskflow-${svc}:ci" "${IMAGE}:${SHA_TAG}"
            docker tag "taskflow-${svc}:ci" "${IMAGE}:latest"
            docker push "${IMAGE}:${SHA_TAG}"
            docker push "${IMAGE}:latest"
          done
