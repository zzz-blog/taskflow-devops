# Dependabot：依赖与 Actions 版本的自动升级 PR
version: 2
updates:
  - package-ecosystem: pip
    directory: /app/api
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /app/api
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /app/web
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
