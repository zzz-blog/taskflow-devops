<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1060" viewBox="0 0 1560 1060">
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f8cff"/>
    </marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <marker id="aYellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b96ad"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif; }
      .h1 { font-size: 26px; font-weight: 700; fill: #eef2f9; text-anchor: middle; }
      .sub { font-size: 13px; fill: #8b96ad; text-anchor: middle; }
      .zl { font-size: 15px; font-weight: 600; fill: #9fb3d9; }
      .bt { font-size: 16px; font-weight: 600; fill: #e7ecf5; text-anchor: middle; }
      .bs { font-size: 11.5px; fill: #93a2bd; text-anchor: middle; }
      .bl { font-size: 11px; fill: #7e8ba3; text-anchor: middle; }
      .lg { font-size: 12px; fill: #a9b6cd; }
      .box { fill: #182338; stroke: #2f4066; stroke-width: 1.5; }
      .zone { fill: #111a2c; stroke: #25324e; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1560" height="1060" fill="#0c1220"/>
  <text x="780" y="44" class="h1">TaskFlow · 云原生 DevOps 端到端架构</text>
  <text x="780" y="70" class="sub">Java 21 / Spring Boot 3 · GitHub Actions CI/CD · Kubernetes (k3s) · Prometheus + Grafana + Loki · Terraform + Ansible</text>

  <!-- ============ Zone A：CI/CD 流水线 ============ -->
  <rect x="40" y="90" width="1480" height="170" rx="14" class="zone"/>
  <rect x="64" y="106" width="10" height="10" rx="2" fill="#4f8cff"/>
  <text x="82" y="116" class="zl">CI / CD 流水线 · GitHub Actions</text>

  <rect x="70" y="150" width="130" height="68" rx="10" class="box"/>
  <rect x="82" y="156" width="30" height="4" rx="2" fill="#4f8cff"/>
  <text x="135" y="179" class="bt">开发者</text>
  <text x="135" y="197" class="bs">PR / main 推送</text>

  <rect x="270" y="150" width="150" height="68" rx="10" class="box"/>
  <rect x="282" y="156" width="30" height="4" rx="2" fill="#4f8cff"/>
  <text x="345" y="179" class="bt">GitHub 仓库</text>
  <text x="345" y="197" class="bs">代码 + K8s 清单（事实源）</text>

  <rect x="490" y="150" width="230" height="68" rx="10" class="box"/>
  <rect x="502" y="156" width="30" height="4" rx="2" fill="#4f8cff"/>
  <text x="605" y="178" class="bt">CI 质量门禁</text>
  <text x="605" y="196" class="bs">lint · test · JaCoCo ≥80% · Trivy</text>
  <text x="605" y="210" class="bs">kubeconform · helm lint · tf validate</text>

  <rect x="790" y="150" width="160" height="68" rx="10" class="box"/>
  <rect x="802" y="156" width="30" height="4" rx="2" fill="#4f8cff"/>
  <text x="870" y="178" class="bt">GHCR 镜像仓库</text>
  <text x="870" y="196" class="bs">taskflow-api / taskflow-web</text>
  <text x="870" y="210" class="bs">sha + latest 双标签</text>

  <rect x="1020" y="150" width="190" height="68" rx="10" class="box"/>
  <rect x="1032" y="156" width="30" height="4" rx="2" fill="#fbbf24"/>
  <text x="1115" y="178" class="bt">GitOps 回写</text>
  <text x="1115" y="196" class="bs">kustomize set image</text>
  <text x="1115" y="210" class="bs">bot commit [skip ci]</text>

  <rect x="1285" y="150" width="205" height="68" rx="10" class="box"/>
  <rect x="1297" y="156" width="30" height="4" rx="2" fill="#4f8cff"/>
  <text x="1387" y="178" class="bt">ArgoCD / kubectl</text>
  <text x="1387" y="196" class="bs">sync 滚动更新</text>
  <text x="1387" y="210" class="bs">零停机发布</text>

  <!-- 流水线箭头 -->
  <line x1="200" y1="184" x2="262" y2="184" stroke="#4f8cff" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="231" y="172" class="bl">git push / PR</text>
  <line x1="420" y1="184" x2="482" y2="184" stroke="#4f8cff" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="451" y="172" class="bl">触发</text>
  <line x1="720" y1="184" x2="782" y2="184" stroke="#4f8cff" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="751" y="172" class="bl">构建镜像</text>
  <line x1="950" y1="184" x2="1012" y2="184" stroke="#4f8cff" stroke-width="2" marker-end="url(#aBlue)"/>
  <line x1="1210" y1="184" x2="1277" y2="184" stroke="#4f8cff" stroke-width="2" marker-end="url(#aBlue)"/>

  <!-- GitOps 回写环（黄色虚线） -->
  <path d="M1115,150 L1115,126 L345,126 L345,142" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#aYellow)"/>
  <text x="730" y="118" class="bl" fill="#fbbf24">镜像 tag 回写 [skip ci]</text>

  <!-- 部署箭头：ArgoCD -> 集群 -->
  <path d="M1387,218 L1387,272 L645,272 L645,292" fill="none" stroke="#4f8cff" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="1016" y="262" class="bl">kubectl apply -k overlays/prod · 滚动更新</text>

  <!-- ============ Zone B：K8s 集群 ============ -->
  <rect x="220" y="300" width="830" height="470" rx="14" class="zone"/>
  <rect x="244" y="316" width="10" height="10" rx="2" fill="#2ecc8f"/>
  <text x="262" y="326" class="zl">Kubernetes（k3s）集群 · 阿里云 ECS</text>

  <rect x="70" y="446" width="120" height="56" rx="10" class="box"/>
  <text x="130" y="472" class="bt">用户</text>
  <text x="130" y="490" class="bs">浏览器访问</text>

  <rect x="300" y="350" width="170" height="48" rx="10" class="box"/>
  <text x="385" y="372" class="bt">Ingress</text>
  <text x="385" y="390" class="bs">ingress-nginx · taskflow.local</text>

  <rect x="300" y="438" width="170" height="64" rx="10" class="box"/>
  <rect x="312" y="448" width="30" height="4" rx="2" fill="#2ecc8f"/>
  <text x="385" y="466" class="bt">web ×N</text>
  <text x="385" y="484" class="bs">Nginx 前端 · 静态资源</text>
  <text x="385" y="498" class="bs">8080（非特权端口）</text>

  <rect x="560" y="428" width="250" height="84" rx="10" class="box"/>
  <rect x="572" y="438" width="30" height="4" rx="2" fill="#2ecc8f"/>
  <text x="685" y="458" class="bt">api ×N · Spring Boot 3</text>
  <text x="685" y="478" class="bs">Actuator 双探针 · HPA 2→6</text>
  <text x="685" y="494" class="bs">Micrometer 指标暴露 · 结构化日志</text>

  <rect x="860" y="430" width="170" height="80" rx="10" class="box"/>
  <rect x="872" y="440" width="30" height="4" rx="2" fill="#2ecc8f"/>
  <text x="945" y="458" class="bt">PostgreSQL 16</text>
  <text x="945" y="476" class="bs">StatefulSet + headless</text>
  <text x="945" y="492" class="bs">PVC 5Gi 持久化</text>

  <rect x="560" y="560" width="250" height="48" rx="10" class="box"/>
  <rect x="572" y="570" width="30" height="4" rx="2" fill="#a78bfa"/>
  <text x="685" y="582" class="bt">ServiceMonitor</text>
  <text x="685" y="598" class="bs">Prometheus Operator · 15s 抓取</text>

  <rect x="300" y="560" width="170" height="48" rx="10" class="box"/>
  <rect x="312" y="570" width="30" height="4" rx="2" fill="#94a3b8"/>
  <text x="385" y="582" class="bt">Secret / ConfigMap</text>
  <text x="385" y="598" class="bs">envFrom 注入配置</text>

  <!-- 集群内部箭头 -->
  <line x1="190" y1="474" x2="292" y2="474" stroke="#4f8cff" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="240" y="462" class="bl">HTTP</text>
  <line x1="385" y1="398" x2="385" y2="430" stroke="#4f8cff" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="397" y="418" class="bl">路由</text>
  <line x1="470" y1="470" x2="552" y2="470" stroke="#4f8cff" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="511" y="458" class="bl">/api 反代</text>
  <line x1="810" y1="470" x2="852" y2="470" stroke="#4f8cff" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="831" y="458" class="bl">JDBC</text>

  <line x1="685" y1="512" x2="685" y2="552" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#aPurple)"/>
  <text x="697" y="540" class="bl">/actuator/prometheus</text>
  <path d="M470,575 L568,518" fill="none" stroke="#8b96ad" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#aGray)"/>
  <text x="478" y="545" class="bl">envFrom</text>

  <!-- ============ Zone C：可观测性 ============ -->
  <rect x="1070" y="300" width="450" height="470" rx="14" class="zone"/>
  <rect x="1094" y="316" width="10" height="10" rx="2" fill="#a78bfa"/>
  <text x="1112" y="326" class="zl">可观测性 · Prometheus 栈</text>

  <rect x="1110" y="350" width="370" height="56" rx="10" class="box"/>
  <rect x="1122" y="360" width="30" height="4" rx="2" fill="#a78bfa"/>
  <text x="1295" y="374" class="bt">Prometheus</text>
  <text x="1295" y="392" class="bs">指标采集 · 告警规则评估（8 条规则）</text>

  <rect x="1110" y="460" width="370" height="56" rx="10" class="box"/>
  <rect x="1122" y="470" width="30" height="4" rx="2" fill="#a78bfa"/>
  <text x="1295" y="484" class="bt">Grafana</text>
  <text x="1295" y="502" class="bs">看板即代码 · 数据源 / 看板自动装配</text>

  <rect x="1110" y="570" width="370" height="56" rx="10" class="box"/>
  <rect x="1122" y="580" width="30" height="4" rx="2" fill="#a78bfa"/>
  <text x="1295" y="594" class="bt">Loki + Promtail</text>
  <text x="1295" y="612" class="bs">容器日志聚合 · 标签索引 · 低成本存储</text>

  <rect x="1110" y="680" width="370" height="56" rx="10" class="box"/>
  <rect x="1122" y="690" width="30" height="4" rx="2" fill="#a78bfa"/>
  <text x="1295" y="704" class="bt">Alertmanager</text>
  <text x="1295" y="722" class="bs">分级路由 · 抑制规则 · webhook 外发</text>

  <!-- 监控面箭头 -->
  <path d="M810,584 L1060,584 L1060,378 L1102,378" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#aPurple)"/>
  <text x="930" y="572" class="bl">抓取指标 15s</text>
  <line x1="1295" y1="406" x2="1295" y2="452" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#aPurple)"/>
  <text x="1307" y="434" class="bl">数据源</text>
  <line x1="1295" y1="570" x2="1295" y2="524" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#aPurple)"/>
  <text x="1307" y="552" class="bl">日志查询</text>
  <path d="M1480,376 C1520,430 1520,650 1484,700" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#aPurple)"/>
  <text x="1498" y="549" class="bl" text-anchor="end">告警评估</text>
  <line x1="1050" y1="598" x2="1102" y2="598" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#aPurple)"/>
  <text x="1076" y="618" class="bl">容器日志</text>

  <!-- ============ Zone D：IaC 与自动化 ============ -->
  <rect x="40" y="810" width="1480" height="160" rx="14" class="zone"/>
  <rect x="64" y="826" width="10" height="10" rx="2" fill="#94a3b8"/>
  <text x="82" y="836" class="zl">IaC 与自动化 · Terraform / Ansible / Scripts</text>

  <rect x="80" y="860" width="320" height="64" rx="10" class="box"/>
  <rect x="92" y="870" width="30" height="4" rx="2" fill="#94a3b8"/>
  <text x="240" y="886" class="bt">Terraform</text>
  <text x="240" y="904" class="bs">阿里云 VPC · 安全组 · ECS 开通</text>
  <text x="240" y="918" class="bs">user_data 开机自动安装 k3s</text>

  <rect x="460" y="860" width="320" height="64" rx="10" class="box"/>
  <rect x="472" y="870" width="30" height="4" rx="2" fill="#94a3b8"/>
  <text x="620" y="886" class="bt">Ansible</text>
  <text x="620" y="904" class="bs">裸机初始化 · k3s 安装</text>
  <text x="620" y="918" class="bs">deploy.yml 幂等部署应用</text>

  <rect x="840" y="860" width="250" height="64" rx="10" class="box"/>
  <rect x="852" y="870" width="30" height="4" rx="2" fill="#94a3b8"/>
  <text x="965" y="886" class="bt">运维脚本</text>
  <text x="965" y="904" class="bs">smoke-test · load-test</text>
  <text x="965" y="918" class="bs">db-backup</text>

  <rect x="1150" y="860" width="320" height="64" rx="10" class="box"/>
  <rect x="1162" y="870" width="30" height="4" rx="2" fill="#94a3b8"/>
  <text x="1310" y="886" class="bt">docker-compose</text>
  <text x="1310" y="904" class="bs">本地一键全栈演示</text>
  <text x="1310" y="918" class="bs">应用 + 监控 + 日志</text>

  <line x1="400" y1="892" x2="452" y2="892" stroke="#8b96ad" stroke-width="1.8" marker-end="url(#aGray)"/>
  <text x="426" y="880" class="bl">outputs → inventory</text>
  <line x1="780" y1="892" x2="832" y2="892" stroke="#8b96ad" stroke-width="1.8" marker-end="url(#aGray)"/>

  <line x1="245" y1="860" x2="245" y2="778" stroke="#8b96ad" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#aGray)"/>
  <text x="257" y="800" class="bl">开通云资源</text>
  <line x1="645" y1="860" x2="645" y2="778" stroke="#8b96ad" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#aGray)"/>
  <text x="657" y="800" class="bl">安装 k3s · 部署应用</text>

  <!-- ============ 图例 ============ -->
  <line x1="80" y1="1012" x2="108" y2="1012" stroke="#4f8cff" stroke-width="2.5"/>
  <text x="114" y="1016" class="lg">业务 / 发布流</text>
  <line x1="250" y1="1012" x2="278" y2="1012" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="284" y="1016" class="lg">指标 / 日志 / 数据源</text>
  <line x1="490" y1="1012" x2="518" y2="1012" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="524" y="1016" class="lg">GitOps 回写</text>
  <line x1="650" y1="1012" x2="678" y2="1012" stroke="#8b96ad" stroke-width="2.5" stroke-dasharray="5 5"/>
  <text x="684" y="1016" class="lg">IaC / 配置注入</text>
  <text x="1480" y="1016" class="lg" text-anchor="end" fill="#66738c">zzz-blog/taskflow-devops</text>
