apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: taskflow
  labels:
    app: taskflow-postgres
spec:
  type: ClusterIP
  selector:
    app: taskflow-postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
# StatefulSet 要求的 headless service
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: taskflow
  labels:
    app: taskflow-postgres
spec:
  clusterIP: None
  selector:
    app: taskflow-postgres
  ports:
    - name: pg
      port: 5432
