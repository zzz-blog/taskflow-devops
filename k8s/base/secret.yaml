# 演示用 Secret（明文 base64 免责说明见 README）
# 生产实践应使用 External Secrets / Sealed Secrets / Vault，这也是本项目文档中的扩展方向
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secret
  namespace: taskflow
type: Opaque
stringData:
  POSTGRES_USER: taskflow
  POSTGRES_PASSWORD: change-me-strong-password
  POSTGRES_DB: taskflow
