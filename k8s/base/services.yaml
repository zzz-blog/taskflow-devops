apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: taskflow
  labels:
    app: taskflow-api
spec:
  type: ClusterIP
  selector:
    app: taskflow-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: taskflow
  labels:
    app: taskflow-web
spec:
  type: ClusterIP
  selector:
    app: taskflow-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
